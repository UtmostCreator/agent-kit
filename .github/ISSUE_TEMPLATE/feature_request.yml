name: Feature request
description: Propose a bounded improvement
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository-operation problem is not adequately solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Include inputs, outputs, scope, failure behavior, and safety implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This can preserve existing command and output contracts.
        - label: This requires a documented breaking change.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Harden the runner (audit-only; observes egress, never blocks)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact tag without external actions
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Install validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck jq ripgrep zip

      - name: Validate and test
        run: |
          set -euo pipefail
          ./scripts/check-publishable.sh
          ./scripts/check.sh

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package-release.sh "${RELEASE_TAG}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "AgentKit ${RELEASE_TAG}"

  attest:
    name: attest
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden the runner (audit-only; observes egress, never blocks)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download the just-published release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --repo "${{ github.repository }}" \
            --pattern '*.tar.gz' --dir dist

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/agent-kit-*.tar.gz'
